services:
  app:
    build:
      context: server
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - db
      - post_app
      - metric_service
    restart: always

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chebryakov
      POSTGRES_PASSWORD: password
      POSTGRES_DB: RestApiServer

    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  post_app:
    build:
      context: grpc_post_server
      dockerfile: Dockerfile
    ports:
      - "8800:8800"
    depends_on:
      - post_db
    restart: always

  post_db:
    image: postgres:13
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: chebryakov
      POSTGRES_PASSWORD: password
      POSTGRES_DB: GrpcPostServer

    volumes:
      - post_postgres_data:/var/lib/postgresql/data
    restart: always

  metric_db:
    image: postgres:13
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: chebryakov
      POSTGRES_PASSWORD: password
      POSTGRES_DB: MetricDB

    volumes:
      - metric_data:/var/lib/postgresql/data
    restart: always

  metric_service:
    build:
      context: metric_service
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
      - "5556:5556"
    depends_on:
      - kafka
      - kafka-ui
      - metric_db
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_JMX_PORT: 9997
    ports:
      - "9092:9092"
  kafka-ui:
    container_name: "kafka-ui"
    image: provectuslabs/kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: 'local'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      DYNAMIC_CONFIG_ENABLED: 'true'
    ports:
      - "8000:8080"

volumes:
  postgres_data:
  post_postgres_data:
  metric_data:
