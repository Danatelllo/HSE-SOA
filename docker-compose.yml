services:
  app:
    build:
      context: server
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - db
      - post_app
    restart: always

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chebryakov
      POSTGRES_PASSWORD: password
      POSTGRES_DB: RestApiServer

    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  post_app:
    build:
      context: grpc_post_server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - post_db
    restart: always

  post_db:
    image: postgres:13
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: chebryakov
      POSTGRES_PASSWORD: password
      POSTGRES_DB: GrpcPostServer

    volumes:
      - post_postgres_data:/var/lib/postgresql/data
    restart: always


volumes:
  postgres_data:
  post_postgres_data: